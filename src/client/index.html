<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Terratomic (ALPHA)</title>

    <!-- Oswald now loaded locally via @font-face in styles.css -->

    <link rel="manifest" href="../../resources/manifest.json" />
    <link

      type="image/x-icon"
      href="../../resources/images/Favicon.svg"
    />

    <!-- SEO -->

    <meta
      name="description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />

    <!-- Open Graph -->

    <meta property="og:title" content="Terratomic - Battle Royale" />

    <!-- Critical CSS to prevent FOUC -->
    <style>
      .preload * {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -ms-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }

      html {
        visibility: visible;
        opacity: 1;
      }

      html.preload {
        visibility: hidden;
        opacity: 0;
      }

      .bg-image {
        content: "";
        background-image: url("/images/ColdwarBackground.webp");
        background-position: center;
        background-attachment: fixed;
        background-size: cover;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .dark .bg-image {
        filter: var(--ui-lobby-filter, brightness(0.6) saturate(1.5));
      }

      /* display:none if child has class parent-hidden since we can't use shadow DOM in Lit due to Tailwind */
      .component-hideable:has(> .parent-hidden) {
        display: none;
      }

      .drop-shadow-glow {
        filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 15px #00ff00);
      }

      /* Scale container based on screen height */
      .scale-container {
        transform-origin: top;
        transition: transform 0.3s ease-in-out;
      }
    </style>

    <!-- Immediate execution to prevent FOUC -->
    <script>
      document.documentElement.className = "preload";
    </script>
  </head>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });
    </script>
    <!-- Adaptive JS scaling for .scale-container -->
    <script>
      (function () {
        function computeScale() {
          var height = Math.max(
            document.documentElement.clientHeight,
            window.innerHeight || 0,
          );
          var baseHeight = 1150;
          if (height >= baseHeight) return 1;
          return Math.min(1, height / baseHeight);
        }

        function applyScale() {
          var container = document.querySelector(".scale-container");
          if (!container) return;
          var scale = computeScale();
          container.style.transform = "scale(" + scale + ")";
          // Compensate layout gap created by transform (which doesn't affect flow height)
          // Compensate using base height as an approximation for natural content height
          var baseHeight = 1150;
          var compensation = 440;
          container.style.marginBottom = compensation
            ? "-" + compensation + "px"
            : "0px";
        }

        function onResize() {
          requestAnimationFrame(applyScale);
        }

        window.addEventListener("resize", onResize);
        window.addEventListener("DOMContentLoaded", applyScale);
        // Initial apply
        onResize();
      })();
    </script>
