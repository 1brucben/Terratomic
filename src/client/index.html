    <!-- Oswald now loaded locally via @font-face in styles.css -->

      name="description"

    <!-- Critical CSS to prevent FOUC -->
    <style>
      .preload * {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -ms-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }

      html {
        visibility: visible;
        opacity: 1;
      }

      html.preload {
        visibility: hidden;
        opacity: 0;
      }

      .bg-image {
        content: "";
        background-image: url("/images/ColdwarBackground.webp");
        background-position: center;
        background-attachment: fixed;
        background-size: cover;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .dark .bg-image {
        filter: var(--ui-lobby-filter, brightness(0.6) saturate(1.5));
      }

      /* display:none if child has class parent-hidden since we can't use shadow DOM in Lit due to Tailwind */
      .component-hideable:has(> .parent-hidden) {
        display: none;
      }

      .drop-shadow-glow {
        filter: drop-shadow(0 0 5px #00ff00) drop-shadow(0 0 15px #00ff00);
      }

      /* Scale container based on screen height */
      .scale-container {
        transform-origin: top;
        transition: transform 0.3s ease-in-out;
      }

      body.mobile-main-lobby {
        overflow-y: auto;
      }

      body.mobile-main-lobby .bg-image {
        background-image: url("/images/mobile-bg-grey.png");
        filter: brightness(0.38) saturate(0.92) contrast(1.06);
      }

      body.mobile-main-lobby .l-header__highlightText {
        top: max(env(safe-area-inset-top, 0px), 6px);
        left: 8px;
        font-size: 0.7rem;
        opacity: 0.9;
      }

      body.mobile-main-lobby main {
        padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 5rem);

    <!-- Adaptive JS scaling for .scale-container -->
    <script>
      (function () {
        function isMobileLobbyDevice() {
          var isMobileWidth = window.matchMedia("(max-width: 1024px)").matches;
          var hasCoarsePointer = window.matchMedia("(pointer: coarse)").matches;
          var mobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(
            navigator.userAgent,
          );
          return isMobileWidth && (hasCoarsePointer || mobileUA);
        }

        function isPhoneLandscape() {
          var isLandscape = window.matchMedia(
            "(orientation: landscape)",
          ).matches;
          return isLandscape && isMobileLobbyDevice();
        }

        function computeScale() {
          var height = Math.max(
            document.documentElement.clientHeight,
            window.innerHeight || 0,
          );
          var baseHeight = 1150;
          if (height >= baseHeight) return 1;
          return Math.min(1, height / baseHeight);
        }

        function applyScale() {
          var container = document.querySelector(".scale-container");
          if (!container) return;

          var mobileMainLobby = isMobileLobbyDevice();
          var mobileLandscape = isPhoneLandscape();
          document.body.classList.toggle("mobile-main-lobby", mobileMainLobby);
          document.body.classList.toggle(
            "mobile-landscape-lobby",
            mobileLandscape,
          );

          if (mobileMainLobby) {
            container.style.transform = "none";
            container.style.marginBottom = "0px";
            return;
          }

          var scale = computeScale();
          container.style.transform = "scale(" + scale + ")";
          // Compensate layout gap created by transform (which doesn't affect flow height)
          // Compensate using base height as an approximation for natural content height
          var baseHeight = 1150;
          var compensation = 440;
          container.style.marginBottom = compensation
            ? "-" + compensation + "px"
            : "0px";
        }

        function onResize() {
          requestAnimationFrame(applyScale);
        }

        window.addEventListener("resize", onResize);
        window.addEventListener("DOMContentLoaded", applyScale);
        // Initial apply
        onResize();
      })();
    </script>
